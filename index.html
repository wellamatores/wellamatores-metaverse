<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bob — transponder seed</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(ellipse at 40% 50%, #030514, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Ambient animated glow */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,212,255,0.08) 0%, rgba(0,0,0,0.95) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* CENTRAL BOB CONTAINER */
        .seed-core {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.5));
            transition: transform 0.2s ease;
        }

        .seed-core:hover {
            transform: scale(1.02);
        }

        /* Multi-layer bio-cyber glow */
        .bean-glow-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.25) 0%, rgba(255,0,170,0.15) 60%, transparent 90%);
            animation: pulseGlow 2.5s infinite alternate;
            filter: blur(6px);
        }

        .bean-glow-layer-secondary {
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,204,68,0.2) 0%, rgba(0,212,255,0.05) 80%);
            animation: pulseGlowSecondary 3s infinite alternate-reverse;
            filter: blur(12px);
        }

        /* SVG Bob (seed) detailed */
        .bean-svg {
            position: relative;
            width: 160px;
            height: 200px;
            filter: drop-shadow(0 0 8px #00d4ff88);
            animation: floatBean 4s infinite ease-in-out;
            transition: all 0.2s;
        }

        /* Caption label */
        .resonance-caption {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Orbitron', monospace;
            letter-spacing: 3px;
            font-size: 0.8rem;
            color: #00d4ff;
            text-shadow: 0 0 5px #ff00aa;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 30px;
            width: max-content;
            margin: 0 auto;
            border: 1px solid rgba(0,212,255,0.4);
            pointer-events: none;
            white-space: nowrap;
        }

        .resonance-caption span {
            color: #ffcc44;
            font-weight: bold;
        }

        /* Dynamic phrase below Bob */
        .dynamic-phrase {
            position: absolute;
            bottom: -115px;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-family: 'Rajdhani', monospace;
            color: #ff88dd;
            letter-spacing: 2px;
            background: transparent;
            backdrop-filter: blur(2px);
            transition: opacity 0.2s;
        }

        /* Decorative root-like lines on sides */
        .decor-line {
            position: absolute;
            bottom: 20%;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, #ff00aa, transparent);
            filter: blur(2px);
            opacity: 0.5;
            animation: linePulse 3s infinite alternate;
        }

        .decor-line.left {
            left: 5%;
            transform: rotate(25deg);
        }

        .decor-line.right {
            right: 5%;
            transform: rotate(-25deg);
        }

        @keyframes linePulse {
            0% { opacity: 0.2; width: 80px; }
            100% { opacity: 0.7; width: 140px; }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.92);}
            100% { opacity: 0.9; transform: scale(1.15);}
        }

        @keyframes pulseGlowSecondary {
            0% { opacity: 0.1; transform: scale(0.9);}
            100% { opacity: 0.6; transform: scale(1.25);}
        }

        @keyframes floatBean {
            0% { transform: translateY(0px) rotate(0deg);}
            50% { transform: translateY(-10px) rotate(2deg);}
            100% { transform: translateY(0px) rotate(0deg);}
        }

        /* Particle sparks */
        .spark {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 200;
            filter: blur(1px);
            opacity: 0;
        }

        /* Instruction hint */
        .hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.7rem;
            color: rgba(0,212,255,0.5);
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        @keyframes growSpark {
            0% { transform: scale(0.2) translate(0,0); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: scale(1.6) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        .seed-core:active .bean-svg {
            transform: scale(0.97);
            transition: 0.05s;
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="decor-line left"></div>
<div class="decor-line right"></div>

<div class="seed-core" id="seedCore">
    <div class="bean-glow-layer"></div>
    <div class="bean-glow-layer-secondary"></div>
    
    <!-- SVG of Bob (seed) with magic/techno-bio-punk details -->
    <svg class="bean-svg" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.95"/>
                <stop offset="50%" stop-color="#2a2eff" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#ff00aa" stop-opacity="0.9"/>
            </linearGradient>
            <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#ff00aa" stop-opacity="0.3"/>
            </linearGradient>
            <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- Main seed body (bean) organic shape -->
        <path d="M60,12 C30,18 10,42 12,72 C14,100 30,128 58,138 C78,144 88,132 98,110 C108,88 110,62 102,38 C94,18 80,8 60,12Z" 
              fill="url(#beanGrad)" stroke="#00ffff" stroke-width="1.2" filter="url(#neonFilter)"/>
        
        <!-- Inner veins / sprouting cracks -->
        <path d="M58,36 L52,58 L62,68 L70,88 L66,108" stroke="#ffcc44" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="3 4"/>
        <path d="M72,32 L80,54 L78,76 L84,94" stroke="#ff88ff" stroke-width="1.2" fill="none" opacity="0.55"/>
        <path d="M44,48 L56,56 L50,72" stroke="#00ffcc" stroke-width="1" fill="none" opacity="0.6"/>
        
        <!-- Core symbol / transponder node -->
        <circle cx="60" cy="76" r="16" fill="url(#innerGlow)" stroke="#ffcc44" stroke-width="1.5" stroke-dasharray="2 2"/>
        <circle cx="60" cy="76" r="6" fill="#ffffff" fill-opacity="0.8" stroke="#00d4ff" stroke-width="1"/>
        <path d="M60,70 L60,82 M54,76 L66,76" stroke="#ff00aa" stroke-width="1.5" stroke-linecap="round"/>
        
        <!-- Bio-glowing dots around contour -->
        <circle cx="34" cy="62" r="2.5" fill="#ffcc44" opacity="0.8">
            <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="86" cy="84" r="2.5" fill="#00fff0" opacity="0.8">
            <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="118" r="2" fill="#ff88ff">
            <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/>
        </circle>
    </svg>

    <div class="resonance-caption">
        ⚡ BOB · TRANSPONDER ⚡
    </div>
    <div class="dynamic-phrase" id="dynamicPhrase">
        ›› self‑turn program ‹‹
    </div>
</div>

<div class="hint">
    ✦ hover | click for resonance ✦
</div>

<script>
    (function() {
        const seedCore = document.getElementById('seedCore');
        const phraseEl = document.getElementById('dynamicPhrase');
        
        // Array of self-turn / magical response phrases
        const selfTurnPhrases = [
            '›› root::awaken ‹‹',
            '⚘ transponder response ⚘',
            '🌀 self‑turn activated 🌀',
            '🌱 bob reaches for the light 🌱',
            '✨ mapping the unknown ✨',
            '🔮 resonance protocol 🔮',
            '⚡ core distributed ⚡',
            '🎇 seed sprouts in silence',
            '💠 macro‑micro‑meso response',
            '🜁 druid‑protocol: initiation'
        ];
        
        // Create sparks explosion effect
        function createSparksExplosion(centerX, centerY) {
            const particleCount = Math.floor(Math.random() * 55) + 65; // 65-120 sparks
            for (let i = 0; i < particleCount; i++) {
                const spark = document.createElement('div');
                spark.classList.add('spark');
                
                // Random neon colors
                const colors = ['#00d4ff', '#ffcc44', '#ff00aa', '#66ffcc', '#ff66cc', '#aaffff'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                spark.style.backgroundColor = randomColor;
                spark.style.width = Math.random() * 8 + 3 + 'px';
                spark.style.height = spark.style.width;
                spark.style.left = (centerX + (Math.random() - 0.5) * 40) + 'px';
                spark.style.top = (centerY + (Math.random() - 0.5) * 40) + 'px';
                spark.style.filter = `blur(${Math.random() * 2}px)`;
                
                const tx = (Math.random() - 0.5) * 280 + (Math.random() * 100 - 50);
                const ty = (Math.random() - 0.9) * 220 - 30;
                spark.style.setProperty('--tx', tx + 'px');
                spark.style.setProperty('--ty', ty + 'px');
                
                spark.style.animation = `growSpark 1.1s ease-out forwards`;
                spark.style.animationDelay = Math.random() * 0.2 + 's';
                document.body.appendChild(spark);
                
                setTimeout(() => { if (spark && spark.remove) spark.remove(); }, 1200);
            }
        }
        
        // Intensify glow and pulse effect on click
        function intensifyGlow() {
            const glowMain = document.querySelector('.bean-glow-layer');
            const svgBean = document.querySelector('.bean-svg');
            if (glowMain) {
                glowMain.style.animation = 'none';
                glowMain.style.transform = 'scale(1.2)';
                glowMain.style.opacity = '0.95';
                setTimeout(() => {
                    if (glowMain) {
                        glowMain.style.animation = 'pulseGlow 2.5s infinite alternate';
                        glowMain.style.transform = '';
                        glowMain.style.opacity = '';
                    }
                }, 350);
            }
            if (svgBean) {
                svgBean.style.filter = 'drop-shadow(0 0 20px #ff00aa)';
                setTimeout(() => {
                    if(svgBean) svgBean.style.filter = 'drop-shadow(0 0 8px #00d4ff88)';
                }, 400);
            }
            if (phraseEl) {
                phraseEl.style.transform = 'scale(1.05)';
                phraseEl.style.color = '#ffcc44';
                setTimeout(() => {
                    if(phraseEl) {
                        phraseEl.style.transform = '';
                        phraseEl.style.color = '#ff88dd';
                    }
                }, 200);
            }
        }
        
        // Main resonance activation: sparks, phrase change + pulse
        function activateResonance(event) {
            let clientX, clientY;
            if (event.touches) {
                const rect = seedCore.getBoundingClientRect();
                clientX = rect.left + rect.width / 2;
                clientY = rect.top + rect.height / 2;
            } else if (event.clientX) {
                clientX = event.clientX;
                clientY = event.clientY;
            } else {
                const rect = seedCore.getBoundingClientRect();
                clientX = rect.left + rect.width / 2;
                clientY = rect.top + rect.height / 2;
            }
            
            createSparksExplosion(clientX, clientY);
            
            const randomIndex = Math.floor(Math.random() * selfTurnPhrases.length);
            const newPhrase = selfTurnPhrases[randomIndex];
            if (phraseEl) {
                phraseEl.style.opacity = '0';
                setTimeout(() => {
                    phraseEl.innerText = newPhrase;
                    phraseEl.style.opacity = '1';
                }, 80);
            }
            
            intensifyGlow();
            
            // Add brief cyber impulse ring
            const pulseRing = document.createElement('div');
            pulseRing.style.position = 'fixed';
            pulseRing.style.left = (clientX - 30) + 'px';
            pulseRing.style.top = (clientY - 30) + 'px';
            pulseRing.style.width = '60px';
            pulseRing.style.height = '60px';
            pulseRing.style.borderRadius = '50%';
            pulseRing.style.border = '2px solid #ffcc44';
            pulseRing.style.boxShadow = '0 0 20px #00d4ff';
            pulseRing.style.pointerEvents = 'none';
            pulseRing.style.zIndex = '150';
            pulseRing.style.animation = 'pulseRingExpand 0.8s ease-out forwards';
            document.body.appendChild(pulseRing);
            setTimeout(() => { if (pulseRing && pulseRing.remove) pulseRing.remove(); }, 800);
            
            console.log(`%c⚡ Transponder response: ${newPhrase}`, 'color: #00d4ff; font-size: 12px;');
        }
        
        // Add ring animation keyframe if missing
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulseRingExpand {
                0% { transform: scale(0.4); opacity: 0.8; }
                100% { transform: scale(3); opacity: 0; border-color: #ff00aa; }
            }
            @keyframes growSpark {
                0% { transform: scale(0.2) translate(0, 0); opacity: 0; }
                25% { opacity: 1; transform: scale(0.9) translate(0, 0); }
                100% { transform: scale(1.8) translate(var(--tx), var(--ty)); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Event listeners for click and touch
        seedCore.addEventListener('click', (e) => {
            e.stopPropagation();
            activateResonance(e);
        });
        
        seedCore.addEventListener('touchstart', (e) => {
            e.preventDefault();
            activateResonance(e);
        });
        
        // Hover effects
        seedCore.addEventListener('mouseenter', () => {
            const svg = document.querySelector('.bean-svg');
            if (svg) {
                svg.style.filter = 'drop-shadow(0 0 15px #ff88ff)';
            }
            const glowSec = document.querySelector('.bean-glow-layer-secondary');
            if (glowSec) glowSec.style.animationDuration = '1.5s';
        });
        
        seedCore.addEventListener('mouseleave', () => {
            const svg = document.querySelector('.bean-svg');
            if (svg) {
                svg.style.filter = 'drop-shadow(0 0 8px #00d4ff88)';
            }
            const glowSec = document.querySelector('.bean-glow-layer-secondary');
            if (glowSec) glowSec.style.animationDuration = '3s';
        });
        
        // Auto gentle phrase rotation every 18 seconds
        let autoPhraseInterval = setInterval(() => {
            if (phraseEl && document.hasFocus()) {
                const randomIdx = Math.floor(Math.random() * selfTurnPhrases.length);
                const gentlePhrase = selfTurnPhrases[randomIdx];
                phraseEl.style.opacity = '0';
                setTimeout(() => {
                    if (phraseEl) {
                        phraseEl.innerText = gentlePhrase;
                        phraseEl.style.opacity = '1';
                    }
                }, 100);
                setTimeout(() => {
                    if (phraseEl && phraseEl.innerText !== '›› self‑turn program ‹‹') {
                        phraseEl.style.opacity = '0';
                        setTimeout(() => {
                            if (phraseEl && !document.querySelector('.seed-core:active')) {
                                phraseEl.innerText = '›› self‑turn program ‹‹';
                                phraseEl.style.opacity = '1';
                            } else if (phraseEl) {
                                phraseEl.innerText = '›› self‑turn program ‹‹';
                                phraseEl.style.opacity = '1';
                            }
                        }, 180);
                    }
                }, 5000);
            }
        }, 18000);
        
        // Initial welcome impulse on load
        setTimeout(() => {
            const rect = seedCore.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            for (let i = 0; i < 28; i++) {
                setTimeout(() => {
                    const sparkHint = document.createElement('div');
                    sparkHint.classList.add('spark');
                    sparkHint.style.backgroundColor = '#00d4ff';
                    sparkHint.style.width = '4px';
                    sparkHint.style.height = '4px';
                    sparkHint.style.left = centerX + (Math.random() - 0.5) * 50 + 'px';
                    sparkHint.style.top = centerY + (Math.random() - 0.5) * 40 + 'px';
                    sparkHint.style.setProperty('--tx', (Math.random() - 0.5) * 120 + 'px');
                    sparkHint.style.setProperty('--ty', (Math.random() - 0.8) * 80 - 20 + 'px');
                    sparkHint.style.animation = `growSpark 0.9s ease-out forwards`;
                    document.body.appendChild(sparkHint);
                    setTimeout(() => sparkHint.remove(), 1000);
                }, i * 50);
            }
            if (phraseEl) phraseEl.innerText = '⚡ seed awakened ⚡';
            setTimeout(() => {
                if(phraseEl) phraseEl.innerText = '›› self‑turn program ‹‹';
            }, 2200);
        }, 500);
        
        // Cleanup reference (if needed)
        window.clearBeanInterval = () => clearInterval(autoPhraseInterval);
    })();
</script>
</body>
</html>
