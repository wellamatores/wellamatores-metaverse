    // ========== GENERATOR CODE (preserved from your file) ==========
    async function extractTextFromFile(file) {
        const fileType = file.type;
        const fileName = file.name.toLowerCase();
        if (fileType === 'application/pdf' || fileName.endsWith('.pdf')) {
            return `[PDF CONTENT SIMULATION] File: ${file.name}. Real integration: pdf.js extracts text. Plutonia Geothermal: 92% capacity. Swamp bonds APY increased to 10.2%. Night Kwa rituals scheduled.`;
        } 
        else if (fileType.startsWith('image/')) {
            return `[IMAGE OCR SIMULATION] ${file.name}. Detected swamp patterns: Meganeura racetrack expansion approved. New AI factions in Earth Twin. 500k WELLIA staking pool opens tomorrow.`;
        }
        else if (fileType === 'text/plain' || fileName.endsWith('.txt') || fileName.endsWith('.csv')) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = () => reject("Failed to read text file");
                reader.readAsText(file);
            });
        }
        else {
            return `[BINARY] ${file.name}. Simulated news: Old Swamp Collective votes new geothermal bonds at 11.2% APY.`;
        }
    }

    async function generateNewsFromFile(file, section, byline, customPrompt) {
        let rawText = await extractTextFromFile(file);
        if (typeof rawText !== 'string') rawText = String(rawText);
        const titleSuffix = file.name.replace(/\.[^/.]+$/, "").substring(0, 40);
        const aiSummary = `[AI GENERATED] Based on "${file.name}": ${rawText.substring(0, 200)}... The Regent's council announced new infrastructure bonds. Swamp Data DAO reached consensus. Night Kwa protocol upgrade v2.3 passed. ${customPrompt ? `Context: ${customPrompt}` : ''}`;
        const fullArticle = `Full extraction from ${file.name} (${(file.size/1024).toFixed(1)} KB).\n---\n${rawText.substring(0, 800)}${rawText.length > 800 ? '…' : ''}\n\n---\nAI Narrative: ${aiSummary}`;
        return {
            title: `Swamp Chronicle: ${titleSuffix}`,
            byline: byline || "Chronicle AI Bureau",
            section: section,
            summary: aiSummary.substring(0, 280),
            full_text: fullArticle,
            source_file: file.name,
            processed_at: new Date().toISOString(),
            license_used: validLicense ? validLicense.substring(0,8)+"..." : "demo"
        };
    }

                        <div id="resultArea" style="display: none;">
                            <h3>📄 GENERATED JSON</h3>
                            <div id="jsonPreview" class="json-preview"></div>
                            <div class="generator-buttons">
                                <button id="copyJsonBtn">📋 COPY</button>
                                <button id="downloadArticleJsonBtn">💾 DOWNLOAD JSON</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        if (checkLicenseStored()) {
            document.getElementById('generatorTool').style.display = 'block';
            document.getElementById('licenseMsg').innerHTML = '✅ Active.';
        }
        document.getElementById('activateLicenseBtn').addEventListener('click', () => {
            const code = document.getElementById('licenseInput').value.trim();
            if (setLicense(code)) {
                document.getElementById('generatorTool').style.display = 'block';
                document.getElementById('licenseMsg').innerHTML = '✅ Verified!';
            } else {
                document.getElementById('licenseMsg').innerHTML = '❌ Invalid code.';
            }
        });
        const processBtn = document.getElementById('processFileBtn');
        const fileInput = document.getElementById('genFileInput');
        const statusDiv = document.getElementById('processingStatus');
        const resultArea = document.getElementById('resultArea');
        const jsonPreview = document.getElementById('jsonPreview');
        processBtn.addEventListener('click', async () => {
            if (!validLicense) { statusDiv.innerHTML = '⚠️ Activate license.'; return; }
            if (!fileInput.files.length) { statusDiv.innerHTML = '❌ Upload a file.'; return; }
            const file = fileInput.files[0];
            const section = document.getElementById('genSectionSelect').value;
            const byline = document.getElementById('genByline').value;
            const prompt = document.getElementById('genPrompt').value;
            statusDiv.innerHTML = '🔄 Processing AI extraction...';
            try {
                const article = await generateNewsFromFile(file, section, byline, prompt);
                jsonPreview.textContent = JSON.stringify(article, null, 2);
                resultArea.style.display = 'block';
                statusDiv.innerHTML = '✅ Ready.';
                window.lastArticle = article;
            } catch(e) { statusDiv.innerHTML = `❌ ${e.message}`; }
        });
        document.getElementById('copyJsonBtn')?.addEventListener('click', () => {
            if (jsonPreview.textContent) navigator.clipboard.writeText(jsonPreview.textContent);
        });
        document.getElementById('downloadArticleJsonBtn')?.addEventListener('click', () => {
            if (jsonPreview.textContent) {
                const blob = new Blob([jsonPreview.textContent], {type:'application/json'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `article_${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
            }
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // routing
    let currentPage = 'newspaper';
    function setActiveNav(page) {
        document.querySelectorAll('.nav-links a').forEach(link => {
            const lp = link.getAttribute('data-page');
            if (lp === page) link.classList.add('active');
            else link.classList.remove('active');
        });
    }
    function navigateTo(page) {
        currentPage = page;
        if (page === 'newspaper') renderNewspaper();
        else if (page === 'generator') renderGeneratorPage();
        setActiveNav(page);
    }
    document.getElementById('navNewspaper').addEventListener('click', (e) => { e.preventDefault(); navigateTo('newspaper'); });
    document.getElementById('navGenerator').addEventListener('click', (e) => { e.preventDefault(); navigateTo('generator'); });
    document.getElementById('homeLink').addEventListener('click', (e) => { e.preventDefault(); navigateTo('newspaper'); });
    checkLicenseStored();
    navigateTo('newspaper');
</script>
</body>
</html>
