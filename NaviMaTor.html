<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0F0A">
    <meta name="description" content="NAVIMATOR VANGUARD TDP v4.0 - Plataforma Táctica Digital Integrada | Geoespacial, Análisis IA, Sincronización">
    <title>NAVIMATOR VANGUARD TDP v4.0 · Plataforma Táctica Digital</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/utm@1.1.1/utm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mgrs@1.0.0/mgrs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', 'Courier New', monospace; background: #0A0F0A; }
        #map { width: 100vw; height: 100vh; position: relative; }

        /* ========= PANEL SUPERIOR ========= */
        .oracle-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(10, 15, 10, 0.94);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 10px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #00E5CC;
            box-shadow: 0 0 20px rgba(0, 229, 204, 0.3);
            z-index: 1000;
            pointer-events: none;
            gap: 10px;
        }
        .oracle-title h1 { font-size: 0.9rem; color: #00E5CC; letter-spacing: 1px; }
        .tactical-value { background: #0A1F0A; padding: 4px 16px; border-radius: 40px; color: #00E5CC; font-weight: bold; font-size: 1.3rem; }
        .oracle-stats { display: flex; gap: 15px; }
        .stat-chip { font-size: 0.7rem; background: #162216; padding: 4px 12px; border-radius: 40px; color: #CAFFC2; }
        .lang-selector { pointer-events: auto; background: #0A1F0A; padding: 4px 8px; border-radius: 20px; border: 1px solid #00A86B; cursor: pointer; font-size: 0.7rem; color: #00E5CC; }

        /* ========= PANEL LATERAL IZQUIERDO (CAPAS) ========= */
        .layers-panel {
            position: absolute;
            left: 12px;
            top: 100px;
            background: rgba(8, 12, 8, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px;
            min-width: 170px;
            z-index: 1001;
            pointer-events: auto;
            border-left: 3px solid #00E5CC;
            font-size: 0.7rem;
        }
        .layers-panel h4 { color: #00E5CC; margin-bottom: 8px; font-size: 0.75rem; }
        .layer-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: #B0FFC0; cursor: pointer; }
        .layer-item input { accent-color: #00A86B; width: 14px; height: 14px; cursor: pointer; }

        /* ========= PANEL DERECHO (ANÁLISIS) ========= */
        .reco-panel {
            position: absolute;
            right: 12px;
            top: 100px;
            width: 270px;
            background: rgba(10, 16, 10, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px;
            border-right: 2px solid #00A86B;
            z-index: 1001;
            pointer-events: none;
            font-size: 0.7rem;
        }
        .reco-title { color: #00E5CC; border-bottom: 1px solid #3E7A3E; margin-bottom: 8px; padding-bottom: 4px; }
        .situational-index { font-size: 2rem; font-weight: bold; color: #00E5CC; text-align: center; margin: 8px 0; }
        .reco-item { margin: 6px 0; color: #D0FFD0; display: flex; gap: 8px; align-items: center; }

        /* ========= BARRA INFERIOR ========= */
        .mgrs-bar {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(7, 16, 7, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            z-index: 1001;
            color: #ADEBAD;
            border: 1px solid #2E6B2E;
            pointer-events: none;
            flex-wrap: wrap;
        }

        /* ========= ACCIONES TÁCTICAS ========= */
        .tact-actions {
            position: absolute;
            bottom: 80px;
            left: 12px;
            display: flex;
            gap: 8px;
            z-index: 1002;
            pointer-events: auto;
            flex-wrap: wrap;
        }
        .tact-btn {
            background: #102210dd;
            border: 1px solid #00A86B;
            color: #D4FFD4;
            padding: 6px 12px;
            border-radius: 32px;
            font-family: monospace;
            cursor: pointer;
            font-size: 0.65rem;
            transition: 0.05s linear;
            backdrop-filter: blur(4px);
        }
        .tact-btn:hover { background: #1a3a1add; border-color: #00E5CC; }
        .tact-btn:active { transform: scale(0.96); background: #2C6E2C; }

        .coord-panel {
            position: absolute;
            top: 100px;
            right: 290px;
            background: rgba(11, 19, 11, 0.92);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.6rem;
            color: #C0FFC0;
            pointer-events: none;
            border-right: 2px solid #00E5CC;
            z-index: 1001;
        }

        .log-area {
            position: absolute;
            bottom: 80px;
            right: 12px;
            background: rgba(3, 10, 3, 0.94);
            backdrop-filter: blur(5px);
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 0.6rem;
            width: 250px;
            max-height: 130px;
            overflow-y: auto;
            color: #9CCF9C;
            pointer-events: none;
            z-index: 999;
            font-family: monospace;
        }

        @media (max-width: 800px) {
            .reco-panel { width: 220px; right: 8px; top: 90px; }
            .coord-panel { right: 240px; top: 90px; font-size: 0.55rem; }
            .layers-panel { display: none; }
            .tact-btn { padding: 4px 8px; font-size: 0.55rem; }
        }
        @media (max-width: 480px) {
            .reco-panel { display: none; }
            .coord-panel { right: 12px; top: 90px; width: auto; }
            .log-area { width: 200px; }
        }
        .log-area::-webkit-scrollbar { width: 4px; }
        .log-area::-webkit-scrollbar-track { background: #1a2a1a; }
        .log-area::-webkit-scrollbar-thumb { background: #00A86B; border-radius: 4px; }
    </style>
</head>
<body>
<div id="map"></div>

<div class="oracle-panel">
    <div class="oracle-title"><h1><i class="fas fa-microchip"></i> NAVIMATOR VANGUARD TDP v4.0</h1></div>
    <div class="tactical-value" id="situationalIndexValue">--</div>
    <div class="oracle-stats">
        <div class="stat-chip"><i class="fas fa-eye"></i> <span id="losStat">--</span>% LOS</div>
        <div class="stat-chip"><i class="fas fa-layer-group"></i> <span id="markerCount">0</span> entidades</div>
        <select id="languageSelect" class="lang-selector"><option value="es">🇪🇸 ES</option><option value="pt">🇧🇷 PT</option><option value="en">🇬🇧 EN</option></select>
    </div>
</div>

<div class="layers-panel">
    <h4><i class="fas fa-map"></i> CAPAS TÁCTICAS</h4>
    <div class="layer-item"><input type="checkbox" id="layerBlufor" checked> <i class="fas fa-shield-haltered"></i> <span data-key="blufor">BLUFOR</span></div>
    <div class="layer-item"><input type="checkbox" id="layerOpfor" checked> <i class="fas fa-skull-crossbones"></i> <span data-key="opfor">OPFOR</span></div>
    <div class="layer-item"><input type="checkbox" id="layerAlert" checked> <i class="fas fa-bell"></i> <span data-key="alert">ALERTA</span></div>
    <div class="layer-item"><input type="checkbox" id="layerPoi" checked> <i class="fas fa-flag"></i> <span data-key="poi">PUNTO DE INTERÉS</span></div>
</div>

<div class="reco-panel">
    <div class="reco-title"><i class="fas fa-brain"></i> <span data-key="analysis">ANÁLISIS SITUACIONAL</span></div>
    <div class="situational-index" id="indexDisplay">--</div>
    <div id="recoList"><div class="reco-item"><i class="fas fa-chart-line"></i> <span data-key="waiting">Cargando datos...</span></div></div>
</div>

<div class="coord-panel">
    <div><i class="fas fa-globe"></i> MGRS: <span id="mgrsLive">—</span></div>
    <div><i class="fas fa-location-dot"></i> LAT/LON: <span id="latlonLive">—</span></div>
    <div><i class="fas fa-chart-simple"></i> UTM: <span id="utmLive">—</span></div>
</div>

<div class="mgrs-bar">
    <div><i class="fas fa-border-all"></i> MGRS GRID | Zona 23 22 21 20 19</div>
    <div><i class="fas fa-satellite-dish"></i> GPS <span id="gpsStatus">INICIANDO</span></div>
</div>

<div class="tact-actions">
    <button class="tact-btn" id="placeBluforBtn"><i class="fas fa-user-check"></i> BLUFOR</button>
    <button class="tact-btn" id="placeOpforBtn"><i class="fas fa-skull"></i> OPFOR</button>
    <button class="tact-btn" id="placeAlertBtn"><i class="fas fa-bell"></i> ALERTA</button>
    <button class="tact-btn" id="placePoiBtn"><i class="fas fa-flag"></i> POI</button>
    <button class="tact-btn" id="centerGpsBtn"><i class="fas fa-location-arrow"></i> CENTRO</button>
    <button class="tact-btn" id="refreshAnalysisBtn"><i class="fas fa-chart-simple"></i> ANALIZAR</button>
    <button class="tact-btn" id="clearMarkersBtn"><i class="fas fa-trash-alt"></i> LIMPIAR</button>
</div>

<div class="log-area" id="oracleLog">[>] NAVIMATOR VANGUARD TDP v4.0<br>[>] Persistencia activa<br>[>] Inicializando...</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
    // ==================== NAVIMATOR VANGUARD TDP v4.0 ====================
    // Geoespacial | Análisis IA | Persistencia | Multilenguaje

    let map, userMarker, watchId;
    let currentPos = { lat: -22.9068, lng: -43.1729 };
    let tacticalMarkers = [];
    let db;
    const DB_NAME = 'NavimatorTDP_V4';
    const STORE_NAME = 'geo_entities';
    let currentLang = 'es';

    const translations = {
        es: { blufor:"BLUFOR", opfor:"OPFOR", alert:"ALERTA", poi:"PUNTO DE INTERÉS", analysis:"ANÁLISIS SITUACIONAL", waiting:"Cargando datos...", threat:"AMENAZA", stable:"ESTABLE", critical:"CRÍTICO", los:"LOS" },
        pt: { blufor:"BLUFOR", opfor:"OPFOR", alert:"ALERTA", poi:"PONTO DE INTERESSE", analysis:"ANÁLISE SITUACIONAL", waiting:"Carregando...", threat:"AMEAÇA", stable:"ESTÁVEL", critical:"CRÍTICO", los:"LOS" },
        en: { blufor:"BLUFOR", opfor:"OPFOR", alert:"ALERT", poi:"POINT OF INTEREST", analysis:"SITUATIONAL ANALYSIS", waiting:"Loading data...", threat:"THREAT", stable:"STABLE", critical:"CRITICAL", los:"LOS" }
    };

    function t(key) { return translations[currentLang][key] || key; }
    function updateUITexts() { document.querySelectorAll('[data-key]').forEach(el => { let k = el.getAttribute('data-key'); if(translations[currentLang][k]) el.innerText = translations[currentLang][k]; }); }

    const elements = { mgrsSpan:document.getElementById('mgrsLive'), latlonSpan:document.getElementById('latlonLive'), utmSpan:document.getElementById('utmLive'), logDiv:document.getElementById('oracleLog'), situationalIndexSpan:document.getElementById('situationalIndexValue'), indexDisplaySpan:document.getElementById('indexDisplay'), losStatSpan:document.getElementById('losStat'), markerCountSpan:document.getElementById('markerCount'), gpsStatusSpan:document.getElementById('gpsStatus') };

    function addLog(msg, isAlert = false) {
        let entry = document.createElement('div');
        entry.innerHTML = `🔹 ${new Date().toLocaleTimeString()} · ${msg}`;
        entry.style.color = isAlert ? '#FFB86B' : '#9BFF9B';
        entry.style.fontSize = '0.55rem'; entry.style.marginBottom = '2px';
        elements.logDiv.appendChild(entry);
        while(elements.logDiv.children.length > 18) elements.logDiv.removeChild(elements.logDiv.children[0]);
        entry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function toMGRS(lat, lon) { try { return window.mgrs ? window.mgrs.forward([lon, lat]) : "MGRS--"; } catch(e) { return "err"; } }
    function toUTM(lat, lon) { try { if(window.utm) { let u = window.utm.fromLatLon(lat, lon); return `${u.zoneNum}${u.zoneLetter} ${Math.round(u.easting)}E/${Math.round(u.northing)}N`; } return "UTM--"; } catch(e) { return "conv err"; } }
    function updateCoordsUI(lat, lng) { if(lat && lng) { elements.latlonSpan.innerText = `${lat.toFixed(5)}°, ${lng.toFixed(5)}°`; elements.mgrsSpan.innerText = toMGRS(lat, lng); elements.utmSpan.innerText = toUTM(lat, lng); } }

    function initDB() { return new Promise((resolve, reject) => { let req = indexedDB.open(DB_NAME, 1); req.onerror = e => { addLog(`DB Error: ${e.target.error}`, true); reject(e); }; req.onsuccess = e => { db = e.target.result; addLog("💾 IndexedDB conectado"); resolve(db); }; req.onupgradeneeded = e => { let dbT = e.target.result; if(!dbT.objectStoreNames.contains(STORE_NAME)) { let store = dbT.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true }); store.createIndex('tipo', 'tipo', { unique: false }); store.createIndex('timestamp', 'timestamp'); } addLog("📀 DB estructurado"); }; }); }

    async function saveMarkerToDB(data) { if(!db) return; let tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).add(data); tx.oncomplete = () => addLog(`💾 ${data.tipo.toUpperCase()} guardado`); }
    async function loadMarkersFromDB() { if(!db) return []; let tx = db.transaction(STORE_NAME, 'readonly'); return await tx.objectStore(STORE_NAME).getAll() || []; }
    async function clearDB() { if(!db) return; let tx = db.transaction(STORE_NAME, 'readwrite'); tx.objectStore(STORE_NAME).clear(); tx.oncomplete = () => addLog("🗑️ DB limpiado"); }

    function getMarkerIcon(type) {
        let icons = { blufor: { html:'<i class="fas fa-shield-haltered" style="font-size:28px; color:#2A8CFF;"></i>', label:'BLUFOR', layer:'blufor' }, opfor:{ html:'<i class="fas fa-skull-crossbones" style="font-size:28px; color:#FF4A4A;"></i>', label:'OPFOR', layer:'opfor' }, alert:{ html:'<i class="fas fa-bell" style="font-size:28px; color:#FFAA33;"></i>', label:'ALERTA', layer:'alert' }, poi:{ html:'<i class="fas fa-flag" style="font-size:28px; color:#AAAAAA;"></i>', label:'POI', layer:'poi' } };
        return icons[type] || icons.poi;
    }

    async function addTacticalMarker(lat, lng, type, skipSave = false) {
        let icon = getMarkerIcon(type);
        let el = document.createElement('div');
        el.innerHTML = `<div style="filter:drop-shadow(0 2px 4px black); text-align:center;">${icon.html}</div><div style="background:#000000cc; padding:0px 8px; border-radius:20px; font-size:10px; font-weight:bold; color:white; margin-top:-5px;">${icon.label}</div>`;
        el.style.cursor = 'pointer';
        let marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
        let data = { id: Date.now()+Math.random(), tipo:type, latitude:lat, longitude:lng, titulo:icon.label, timestamp:new Date().toISOString(), camada:icon.layer };
        tacticalMarkers.push({ marker, data });
        if(!skipSave) await saveMarkerToDB(data);
        elements.markerCountSpan.innerText = tacticalMarkers.length;
        addLog(`📍 ${icon.label} en ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
        return data;
    }

    async function clearAllMarkers() { tacticalMarkers.forEach(({marker}) => marker.remove()); tacticalMarkers = []; await clearDB(); elements.markerCountSpan.innerText = 0; addLog("🗑️ Todas las entidades eliminadas"); updateSituationalDisplay(); }

    function calculateSituationalIndex() {
        let blu = tacticalMarkers.filter(m => m.data.tipo === 'blufor').length;
        let op = tacticalMarkers.filter(m => m.data.tipo === 'opfor').length;
        let al = tacticalMarkers.filter(m => m.data.tipo === 'alert').length;
        let total = tacticalMarkers.length;
        if(total === 0) return { index:85, los:75, blu, op, al };
        let threat = (op * 2 + al * 2.5) / (total + 1);
        let index = Math.max(20, Math.min(100, Math.round(100 * (1 - Math.min(1, threat) * 0.65))));
        let los = Math.min(98, Math.max(35, 70 + (blu * 2) - (op * 1.8) - (al * 1.5)));
        return { index, los, blu, op, al, total };
    }

    function generateRecommendations(idx, los, blu, op, al) {
        let rec = [];
        if(idx < 40) rec.push("💀 ÍNDICE CRÍTICO! Evacuación inmediata recomendada.");
        else if(idx < 60) rec.push("⚠️ Situación peligrosa. Reforzar sector NORTE.");
        else if(idx < 75) rec.push("⚡ Inestable. Aumentar vigilancia.");
        else rec.push("✅ Estable. Mantener monitoreo.");
        if(los < 55) rec.push("👁️ Línea de visión comprometida. Reubicar observadores.");
        if(op > blu * 1.3) rec.push("🔴 Superioridad OPFOR. Solicitar apoyo.");
        if(al > 2) rec.push("🚨 Múltiples ALERTAS. Priorizar análisis.");
        if(rec.length === 0) rec.push("📡 Sin anomalías. Continuar.");
        return rec.slice(0,4);
    }

    function updateSituationalDisplay() {
        let { index, los, blu, op, al } = calculateSituationalIndex();
        elements.situationalIndexSpan.innerText = index;
        elements.indexDisplaySpan.innerText = index;
        elements.losStatSpan.innerText = los;
        let color = index < 50 ? '#FF6B6B' : (index < 75 ? '#FFB86B' : '#00E5CC');
        elements.situationalIndexSpan.style.color = color;
        elements.indexDisplaySpan.style.color = color;
        let recos = generateRecommendations(index, los, blu, op, al);
        document.getElementById('recoList').innerHTML = recos.map(r => `<div class="reco-item"><i class="fas fa-chevron-circle-right"></i> ${r}</div>`).join('');
        addLog(`📊 Análisis: Índice ${index} | LOS ${los}% | BLU:${blu} OP:${op} ALT:${al}`);
    }

    function applyLayerFilters() {
        let showBlu = document.getElementById('layerBlufor').checked;
        let showOp = document.getElementById('layerOpfor').checked;
        let showAlt = document.getElementById('layerAlert').checked;
        let showPoi = document.getElementById('layerPoi').checked;
        tacticalMarkers.forEach(({ marker, data }) => {
            let vis = false;
            if(data.tipo === 'blufor') vis = showBlu;
            else if(data.tipo === 'opfor') vis = showOp;
            else if(data.tipo === 'alert') vis = showAlt;
            else vis = showPoi;
            marker.getElement().style.display = vis ? 'block' : 'none';
        });
        addLog("🎨 Filtros aplicados");
    }

    function onGeoSuccess(pos) { currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude }; if(!userMarker) userMarker = new maplibregl.Marker({ color: "#00E5CC", scale: 1.1 }).setLngLat([currentPos.lng, currentPos.lat]).addTo(map); else userMarker.setLngLat([currentPos.lng, currentPos.lat]); updateCoordsUI(currentPos.lat, currentPos.lng); elements.gpsStatusSpan.innerHTML = 'ACTIVO ✓'; elements.gpsStatusSpan.style.color = "#00FF88"; }
    function onGeoError(err) { addLog(`⚠️ GPS: ${err.message}`, true); elements.gpsStatusSpan.innerHTML = 'FALLBACK'; }
    function startGPS() { if(navigator.geolocation) { watchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, { enableHighAccuracy: true, maximumAge: 3000 }); addLog("🛰️ GPS activo"); } else addLog("GPS no soportado", true); }
    function centerOnUser() { if(currentPos.lat && currentPos.lng) map.flyTo({ center: [currentPos.lng, currentPos.lat], zoom: 14, duration: 800 }); else map.flyTo({ center: [-43.1729, -22.9068], zoom: 12 }); addLog("🎯 Centrado en posición"); }

    function onMapClick(e) { let { lat, lng } = e.lngLat; let choice = confirm("Marcar como:\n✓ OK = BLUFOR\n✗ Cancelar = OPFOR"); if(choice) addTacticalMarker(lat, lng, 'blufor'); else addTacticalMarker(lat, lng, 'opfor'); updateSituationalDisplay(); }

    async function initMap() {
        map = new maplibregl.Map({ container: 'map', style: "https://demotiles.maplibre.org/style.json", center: [-43.1729, -22.9068], zoom: 12 });
        map.addControl(new maplibregl.NavigationControl(), 'top-left');
        map.on('click', onMapClick);
        map.on('load', async () => {
            addLog("✔️ Mapa cargado | NAVIMATOR VANGUARD TDP v4.0");
            await initDB();
            let saved = await loadMarkersFromDB();
            for(let m of saved) await addTacticalMarker(m.latitude, m.longitude, m.tipo, true);
            addLog(`📌 ${saved.length} entidades restauradas`);
            updateSituationalDisplay();
            setInterval(updateSituationalDisplay, 10000);
        });
    }

    function bindEvents() {
        document.getElementById('placeBluforBtn').onclick = () => { if(currentPos) addTacticalMarker(currentPos.lat, currentPos.lng, 'blufor'); updateSituationalDisplay(); };
        document.getElementById('placeOpforBtn').onclick = () => { if(currentPos) addTacticalMarker(currentPos.lat + (Math.random()*0.002-0.001), currentPos.lng + (Math.random()*0.002-0.001), 'opfor'); updateSituationalDisplay(); };
        document.getElementById('placeAlertBtn').onclick = () => { if(currentPos) addTacticalMarker(currentPos.lat + (Math.random()*0.0015), currentPos.lng + (Math.random()*0.0015), 'alert'); updateSituationalDisplay(); };
        document.getElementById('placePoiBtn').onclick = () => { if(currentPos) addTacticalMarker(currentPos.lat + (Math.random()*0.001), currentPos.lng + (Math.random()*0.001), 'poi'); updateSituationalDisplay(); };
        document.getElementById('centerGpsBtn').onclick = centerOnUser;
        document.getElementById('refreshAnalysisBtn').onclick = () => { updateSituationalDisplay(); addLog("🔄 Análisis recalculado"); };
        document.getElementById('clearMarkersBtn').onclick = () => { if(confirm("¿Eliminar TODAS las entidades?")) clearAllMarkers(); };
        document.getElementById('layerBlufor').addEventListener('change', applyLayerFilters);
        document.getElementById('layerOpfor').addEventListener('change', applyLayerFilters);
        document.getElementById('layerAlert').addEventListener('change', applyLayerFilters);
        document.getElementById('layerPoi').addEventListener('change', applyLayerFilters);
        document.getElementById('languageSelect').addEventListener('change', (e) => { currentLang = e.target.value; updateUITexts(); addLog(`🌐 Idioma cambiado a ${currentLang.toUpperCase()}`); });
    }

    setInterval(() => { if(currentPos.lat) updateCoordsUI(currentPos.lat, currentPos.lng); }, 2000);
    window.onload = () => { initMap(); startGPS(); bindEvents(); updateUITexts(); addLog("⬛ NAVIMATOR VANGUARD TDP v4.0 OPERACIONAL"); addLog("🔷 IA Asistiva | Persistencia | Geoespacial"); };
</script>
